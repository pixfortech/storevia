# Automated update pull requests (docs/engineering/toolchain-policy.md §4).
# Every PR runs the full CI (both runtimes, Windows, integration, E2E, secret
# scan). The `Dependency update policy` CI job then merges eligible low-risk
# updates and labels the rest for review (.github/dependency-policy.json).
# Majors always arrive as their own PR and are never merged automatically.
#
# Not covered here, and why:
# - pnpm (the `packageManager` field) and the Node LTS line (.nvmrc):
#   Dependabot doesn't update them; .github/workflows/toolchain-watch.yml does.
# - gitleaks in CI: pinned by version and checksum; toolchain-watch reports
#   new releases.
version: 2
updates:
  - package-ecosystem: npm
    # The root covers the whole pnpm workspace (pnpm-workspace.yaml).
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    # Let fresh releases settle before proposing them (supply-chain safety).
    # Security updates are not delayed.
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    ignore:
      # Node type definitions follow the minimum supported Node major
      # (engines.node), not the newest Node: raised together with the floor.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      next-and-react:
        patterns: ["next", "react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: [minor, patch]
      prisma:
        patterns: ["prisma", "@prisma/*"]
        update-types: [minor, patch]
      auth-and-security:
        patterns: ["better-auth", "@better-auth/*", "@node-rs/argon2"]
        update-types: [minor, patch]
      testing:
        patterns: ["vitest", "@vitest/*", "@playwright/test"]
        update-types: [minor, patch]
      typescript-and-lint:
        patterns:
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "eslint"
          - "@eslint/*"
          - "eslint-*"
          - "globals"
          - "prettier"
        update-types: [minor, patch]
      styling:
        patterns: ["tailwindcss", "@tailwindcss/*"]
        update-types: [minor, patch]
      other-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
