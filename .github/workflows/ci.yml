name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Validate draft database schema
        run: pnpm db:validate:draft

      - name: Live schema agrees with the ERD draft
        run: pnpm check:schema

  integration:
    name: Integration and tenant-isolation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      STOREVIA_ENV: test
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgresql://storevia_app:ci-app@localhost:5432/storevia
      DATABASE_MIGRATOR_URL: postgresql://storevia_migrator:ci-migrator@localhost:5432/storevia
      DATABASE_SYSTEM_URL: postgresql://storevia_system:ci-system@localhost:5432/storevia
      DATABASE_PLATFORM_URL: postgresql://storevia_platform:ci-platform@localhost:5432/storevia
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create database roles and databases
        run: pnpm db:setup

      - name: Migrate the test database from zero
        run: pnpm db:test:prepare

      - name: Integration and tenant-isolation tests
        run: pnpm test:integration

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan repository history
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  e2e:
    name: End-to-end security tests (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      STOREVIA_ENV: test
      NODE_ENV: production
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgresql://storevia_app:ci-app@localhost:5432/storevia
      DATABASE_MIGRATOR_URL: postgresql://storevia_migrator:ci-migrator@localhost:5432/storevia
      DATABASE_SYSTEM_URL: postgresql://storevia_system:ci-system@localhost:5432/storevia
      DATABASE_PLATFORM_URL: postgresql://storevia_platform:ci-platform@localhost:5432/storevia
      DASHBOARD_URL: http://app.localhost:3001
      E2E_BASE_URL: http://app.localhost:3001
      PLATFORM_ADMIN_URL: http://admin.localhost:3003
      E2E_ADMIN_URL: http://admin.localhost:3003
      STOREFRONT_ROOT_DOMAIN: store.localhost
      # CI-only throwaway values; real secrets come from the secrets manager.
      AUTH_SECRET: ci-only-auth-secret-not-used-anywhere-else-0000
      AUTH_PLATFORM_SECRET: ci-only-platform-auth-secret-not-used-elsewhere-0000
      MOCK_BILLING_WEBHOOK_SECRET: ci-only-mock-billing-secret-not-used-elsewhere-0000
      EMAIL_TRANSPORT: file
      EMAIL_FILE_DIR: /tmp/storevia-mail
      AUTH_BREACHED_PASSWORD_CHECK: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create database roles and databases
        run: pnpm db:setup

      - name: Apply migrations and load reference data (plans)
        run: pnpm db:migrate && pnpm db:seed

      - name: Build the dashboard and platform-admin
        run: pnpm --filter @storevia/dashboard --filter @storevia/platform-admin build

      - name: Install Playwright Chromium
        run: pnpm --filter @storevia/dashboard exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/dashboard/playwright-report
          retention-days: 7
