name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # Weekly, so the canary meets new Node and PostgreSQL releases even when
  # nothing is pushed (docs/engineering/toolchain-policy.md).
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Runtime matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      primary: ${{ steps.matrix.outputs.primary }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            .github/runtime-matrix.json
          sparse-checkout-cone-mode: false

      - name: Resolve the matrix (.nvmrc + .github/runtime-matrix.json)
        id: matrix
        run: |
          primary="$(tr -d '[:space:]' < .nvmrc)"
          matrix="$(jq -c --arg primary "$primary" \
            '{include: [.runtimes[] | .node = (if .node == "from-nvmrc" then $primary else .node end)]}' \
            .github/runtime-matrix.json)"
          echo "primary=$primary" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Runtime matrix: $matrix" >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify · ${{ matrix.label }}
    runs-on: ubuntu-24.04
    needs: runtime
    # The canary reports incompatibilities early; only the LTS leg is required.
    continue-on-error: ${{ matrix.canary }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.runtime.outputs.matrix) }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          # Latest patch of the chosen line (security fixes).
          check-latest: true
          cache: pnpm

      - name: Runtime versions
        run: |
          echo "node $(node --version), pnpm $(pnpm --version)"
          echo "Node $(node --version), pnpm $(pnpm --version)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Validate draft database schema
        run: pnpm db:validate:draft

      - name: Live schema agrees with the ERD draft
        run: pnpm check:schema

      - name: Repository tooling tests (update policy, toolchain checks)
        run: pnpm test:tooling

  integration:
    name: Integration and tenant isolation · ${{ matrix.label }}
    runs-on: ubuntu-24.04
    needs: runtime
    # The canary reports incompatibilities early; only the LTS leg is required.
    continue-on-error: ${{ matrix.canary }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.runtime.outputs.matrix) }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      STOREVIA_ENV: test
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgresql://storevia_app:ci-app@localhost:5432/storevia
      DATABASE_MIGRATOR_URL: postgresql://storevia_migrator:ci-migrator@localhost:5432/storevia
      DATABASE_SYSTEM_URL: postgresql://storevia_system:ci-system@localhost:5432/storevia
      DATABASE_PLATFORM_URL: postgresql://storevia_platform:ci-platform@localhost:5432/storevia
      DATABASE_BILLING_URL: postgresql://storevia_billing:ci-billing@localhost:5432/storevia
      DATABASE_WORKER_URL: postgresql://storevia_worker:ci-worker@localhost:5432/storevia
      DATABASE_MARKETING_URL: postgresql://storevia_marketing:ci-marketing@localhost:5432/storevia
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          # Latest patch of the chosen line (security fixes).
          check-latest: true
          cache: pnpm

      - name: Runtime versions
        run: |
          echo "node $(node --version), pnpm $(pnpm --version)"
          echo "Node $(node --version), pnpm $(pnpm --version)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create database roles and databases
        run: pnpm db:setup

      - name: Migrate the test database from zero
        run: pnpm db:test:prepare

      - name: Integration and tenant-isolation tests
        run: pnpm test:integration

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan repository history
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  e2e:
    name: End-to-end · ${{ matrix.label }}
    runs-on: ubuntu-24.04
    needs: runtime
    # The canary reports incompatibilities early; only the LTS leg is required.
    continue-on-error: ${{ matrix.canary }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.runtime.outputs.matrix) }}
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      STOREVIA_ENV: test
      NODE_ENV: production
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgresql://storevia_app:ci-app@localhost:5432/storevia
      DATABASE_MIGRATOR_URL: postgresql://storevia_migrator:ci-migrator@localhost:5432/storevia
      DATABASE_SYSTEM_URL: postgresql://storevia_system:ci-system@localhost:5432/storevia
      DATABASE_PLATFORM_URL: postgresql://storevia_platform:ci-platform@localhost:5432/storevia
      DATABASE_BILLING_URL: postgresql://storevia_billing:ci-billing@localhost:5432/storevia
      DATABASE_WORKER_URL: postgresql://storevia_worker:ci-worker@localhost:5432/storevia
      DATABASE_MARKETING_URL: postgresql://storevia_marketing:ci-marketing@localhost:5432/storevia
      DASHBOARD_URL: http://app.localhost:3001
      E2E_BASE_URL: http://app.localhost:3001
      PLATFORM_ADMIN_URL: http://admin.localhost:3003
      E2E_ADMIN_URL: http://admin.localhost:3003
      MARKETING_URL: http://localhost:3000
      E2E_MARKETING_URL: http://localhost:3000
      CONTACT_INBOX: hello@storevia.test
      STOREFRONT_ROOT_DOMAIN: store.localhost
      # CI-only throwaway values; real secrets come from the secrets manager.
      AUTH_SECRET: ci-only-auth-secret-not-used-anywhere-else-0000
      AUTH_PLATFORM_SECRET: ci-only-platform-auth-secret-not-used-elsewhere-0000
      MOCK_BILLING_WEBHOOK_SECRET: ci-only-mock-billing-secret-not-used-elsewhere-0000
      # Production builds must opt in to mock billing explicitly (ADR-0022).
      BILLING_MOCK_ENABLED: "true"
      EMAIL_TRANSPORT: file
      EMAIL_FILE_DIR: /tmp/storevia-mail
      AUTH_BREACHED_PASSWORD_CHECK: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          # Latest patch of the chosen line (security fixes).
          check-latest: true
          cache: pnpm

      - name: Runtime versions
        run: |
          echo "node $(node --version), pnpm $(pnpm --version)"
          echo "Node $(node --version), pnpm $(pnpm --version)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create database roles and databases
        run: pnpm db:setup

      - name: Apply migrations and load reference data (plans)
        run: pnpm db:migrate && pnpm db:seed

      - name: Build the dashboard, platform-admin and marketing site
        run: pnpm --filter @storevia/dashboard --filter @storevia/platform-admin --filter @storevia/marketing build

      - name: Install Playwright Chromium
        run: pnpm --filter @storevia/dashboard exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.channel }}
          path: apps/dashboard/playwright-report
          retention-days: 7

  windows:
    name: Windows · Node LTS
    # Developers work on Windows too: prove install, the non-browser suites,
    # the database scripts and production builds there (no Docker on the
    # runner, so PostgreSQL is the runner's own service).
    needs: runtime
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      CI: "true"
      STOREVIA_ENV: test
      PGPASSWORD: root
      DATABASE_ADMIN_URL: postgresql://postgres:root@localhost:5432/postgres
      DATABASE_URL: postgresql://storevia_app:ci-app@localhost:5432/storevia
      DATABASE_MIGRATOR_URL: postgresql://storevia_migrator:ci-migrator@localhost:5432/storevia
      DATABASE_SYSTEM_URL: postgresql://storevia_system:ci-system@localhost:5432/storevia
      DATABASE_PLATFORM_URL: postgresql://storevia_platform:ci-platform@localhost:5432/storevia
      DATABASE_BILLING_URL: postgresql://storevia_billing:ci-billing@localhost:5432/storevia
      DATABASE_WORKER_URL: postgresql://storevia_worker:ci-worker@localhost:5432/storevia
      DATABASE_MARKETING_URL: postgresql://storevia_marketing:ci-marketing@localhost:5432/storevia
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js ${{ needs.runtime.outputs.primary }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ needs.runtime.outputs.primary }}
          check-latest: true
          cache: pnpm

      - name: Start PostgreSQL
        shell: pwsh
        run: |
          $service = Get-Service -Name "postgresql*" | Select-Object -First 1
          Set-Service -InputObject $service -StartupType Manual
          Start-Service -InputObject $service
          & "$env:PGBIN\pg_isready.exe" -h localhost -p 5432

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Create database roles and databases
        run: pnpm db:setup

      - name: Migrate the test database from zero (no shell-specific scripts)
        run: pnpm db:test:prepare

      - name: Integration and tenant-isolation tests
        run: pnpm test:integration

      - name: Production build
        run: pnpm build

  dependency-policy:
    name: Dependency update policy
    # Dependabot PRs only, and only after every required job passed on this
    # commit. Applies .github/dependency-policy.json: eligible low-risk updates
    # are merged; everything else is labelled for human review.
    needs: [verify, integration, e2e, secret-scan, windows]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout the base branch's policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The policy and classifier come from the base branch, never from
          # the pull request being judged.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/dependency-policy.json
            scripts/dependency-policy.mjs
          sparse-checkout-cone-mode: false

      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-lookup: false

      - name: Classify the update
        id: policy
        env:
          UPDATED_DEPENDENCIES_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          MAINTAINER_CHANGES: ${{ steps.metadata.outputs.maintainer-changes }}
        run: node scripts/dependency-policy.mjs

      - name: Merge an eligible update (all required checks passed above)
        if: steps.policy.outputs.decision == 'auto-merge'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL" || gh pr merge --squash "$PR_URL"

      - name: Mark for review
        if: steps.policy.outputs.decision == 'review'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh label create "dependencies: review required" --color B60205 \
            --description "Major, high-risk or core-framework update: see docs/engineering/toolchain-policy.md" \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh pr edit "$PR_URL" --add-label "dependencies: review required"
