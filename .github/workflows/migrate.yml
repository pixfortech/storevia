name: Migrate database

# Applies pending migrations to staging or production, as the schema owner,
# before a deploy (docs/operations/staging.md). Manual only: it is never
# part of CI and CI never holds these credentials. DATABASE_MIGRATOR_URL is
# a secret of the chosen GitHub environment (the direct, non-pooled Neon
# endpoint with sslmode=require); production requires reviewer approval on
# that environment.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: migrate-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    env:
      STOREVIA_ENV: ${{ inputs.environment }}
      DATABASE_MIGRATOR_URL: ${{ secrets.DATABASE_MIGRATOR_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@storevia/database..."

      - name: Refuse a connection without TLS
        run: |
          case "$DATABASE_MIGRATOR_URL" in
            *sslmode=require*|*sslmode=verify-full*|*sslmode=verify-ca*) ;;
            *) echo "DATABASE_MIGRATOR_URL must set sslmode=require or verify-full" >&2; exit 1 ;;
          esac

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Confirm nothing is pending
        run: pnpm --filter @storevia/database db:check
