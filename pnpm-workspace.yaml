packages:
  - "apps/*"
  - "packages/*"

# Dependency install scripts are blocked by default (pnpm 10). These are known
# and not needed: Prisma 7's client needs no engine download (the root
# postinstall runs `prisma generate`), and esbuild ships its binary as an
# optional platform package.
ignoredBuiltDependencies:
  - "@prisma/engines"
  - prisma
  - esbuild
